<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>コース詳細に移動します…</title>
<style>
  :root{--ink:#0f172a;--muted:#64748b;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;padding:24px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}
  .box{max-width:720px;margin:8vh auto;padding:20px;border:1px solid var(--line);border-radius:12px;background:#fff}
  h1{margin:0 0 6px}
  .muted{color:var(--muted);font-size:14px}
  a{color:var(--ink);text-decoration:none}
</style>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const course = (q.get('course') || '').toLowerCase();
  const map = {
    entry: 'entry_course_detail.html',
    middle: 'middle_course_detail.html',
    practical: 'practical_course_detail.html'
  };
  const target = map[course] || map.entry;
  const dest = target + (location.hash || '');
  // 履歴を汚さない
  location.replace(dest);
})();
</script>
</head>
<body>
  <div class="box">
    <h1>コース詳細に移動します…</h1>
    <p class="muted">自動で切り替わらない場合は、下のリンクをご利用ください。</p>
    <ul>
      <li><a href="./entry_course_detail.html#flow">ENTRY：AI基礎＆日常業務（1日）</a></li>
      <li><a href="./middle_course_detail.html#flow">MIDDLE：業務改善の入口（2週間）</a></li>
      <li><a href="./practical_course_detail.html#flow">PRACTICAL：疑似案件で本格運用（3週間）</a></li>
    </ul>
  </div>
</body>
</html>
