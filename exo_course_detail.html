<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>講座詳細｜AI偏差値診断</title>

  <!-- GA4（必要に応じて差し替え） -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFQZF4F1QW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-QFQZF4F1QW', { send_page_view: true, transport_type: 'beacon', debug_mode: true });
  </script>

  <style>
    :root{ --brand:#7356b6; --ink:#222; --muted:#64748b; --bg:#fafafa; }
    *{ box-sizing:border-box }
    body{ margin:0; font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; color:var(--ink); background:#fff; }
    header{ padding:20px 16px; border-bottom:1px solid #eee; }
    main{ max-width:980px; margin:0 auto; padding:24px 16px 80px; }
    .badge{ display:inline-block; font-size:12px; color:#334155; background:#eef2ff; border:1px solid #c7d2fe; padding:.25em .6em; border-radius:999px; margin-right:8px;}
    h1{ font-size:clamp(24px, 4vw, 36px); margin:8px 0 12px; }
    .meta{ color:var(--muted); margin:6px 0 18px; }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .btn{ display:inline-block; padding:12px 16px; border-radius:10px; border:1px solid #ddd; text-decoration:none; color:#111; background:#fff; }
    .btn.primary{ background:var(--brand); color:#fff; border-color:var(--brand); }
    section{ margin:24px 0; }
    .card{ background:#fff; border:1px solid #eee; border-radius:14px; padding:18px; }
    ul{ margin:8px 0 0 22px; }
    .warn{ background:#fff7ed; border:1px solid #fed7aa; padding:10px 12px; border-radius:10px; color:#9a3412; }
    footer{ text-align:center; font-size:14px; color:#6b7280; padding:24px 16px; border-top:1px solid #eee; margin-top:40px; }
    footer a{ color:#0a58ca; text-decoration:none; margin:0 8px; }
  </style>
</head>
<body>
  <header>
    <div class="row" style="justify-content:space-between;">
      <div><a class="btn" href="./index.html">← 診断に戻る</a></div>
      <div class="row">
        <a class="btn" href="./exo_courses.html">コース一覧に戻る</a>
      </div>
    </div>
  </header>

  <main>
    <div id="badges" class="row"></div>
    <h1 id="title">講座タイトル</h1>
    <div id="meta" class="meta">診断スコア：— ／ レベル：—</div>

    <div class="row">
      <a id="applyBtn" class="btn primary" target="_blank" rel="noopener">この内容で申し込む</a>
      <a class="btn" href="#outline">学習の流れ</a>
      <a class="btn" href="./exo_courses.html">コース一覧に戻る</a>
    </div>

    <section class="card warn" style="margin-top:16px">
      重要：本スクールはカスタムGPTで運用しているため、受講にはChatGPTの有料プラン（ChatGPT Plus 等）への加入が必須です。
    </section>

    <section id="goal" class="card">
      <h2>このコースで狙うこと</h2>
      <p id="goalBody"></p>
    </section>

    <section id="learn" class="card">
      <h2>学べること（コアスキル）</h2>
      <div id="learnCols" class="row" style="align-items:flex-start">
        <div style="flex:1; min-width:240px">
          <ul id="learnLeft"></ul>
        </div>
        <div style="flex:1; min-width:240px">
          <h4 style="margin:0 0 8px">モジュール（例）</h4>
          <ul id="modules"></ul>
        </div>
      </div>
    </section>

    <section id="outline" class="card">
      <h2>学習の流れ</h2>
      <ul id="flow"></ul>
    </section>
  </main>

  <footer>
    <p>
      <a href="./terms.html" target="_blank" rel="noopener">利用規約</a>
      <a href="./privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>
      <a href="./law.html" target="_blank" rel="noopener">特定商取引法に基づく表記</a>
    </p>
  </footer>

  <script>
    // Stripe 決済リンク（運用URLに差し替えてください）
    const STRIPE = {
      entry:     "https://buy.stripe.com/REPLACE_WITH_YOUR_ENTRY_LINK",
      middle:    "https://buy.stripe.com/REPLACE_WITH_YOUR_MIDDLE_LINK",
      practical: "https://buy.stripe.com/REPLACE_WITH_YOUR_PRACTICAL_LINK"
    };

    // 3コース定義
    const COURSES = {
      entry: {
        badge: "入門〜初級向け",
        title: "ENTRY｜AI基礎＆日常業務の成功体験（2–3週間）",
        goal:  "AI初心者や40–50代向けの短期ブート。安全に使い、良い指示で資料/メール/デザイン補助の成果を出す段階へ。",
        learnLeft: ["AIリテラシー","ChatGPT基礎","プロンプト設計","スライド/画像の基礎"],
        modules: ["安全ルール","資料×メール×要約","画像生成基礎","成功指示のテンプレ化"],
        flow: ["S1：ルール＆良い指示の型","S2：資料×メール×要約の高速化","S3：画像生成＆図解の基礎","S4：成功プロンプトの型化","S5：手動自動化の入口（任意）","S6：成果共有とBefore/After"]
      },
      middle: {
        badge: "初級〜中級向け",
        title: "MIDDLE｜AI×業務改善の入口（4–6週間）",
        goal:  "差し込み型テンプレとGASで“小さな自動化”を構築。AIと人のバトンで半自動フローに落とし込み、KPIで可視化します。",
        learnLeft: ["テンプレ構造設計","GAS入門と自動化","A/Bテスト運用","KPI可視化とレポート"],
        modules: ["差し込み型テンプレ設計","フォーム→シート→返信→集計（GAS）","AIと人の役割分担フロー","A/B評価と改善ログ"],
        flow: ["S1：テンプレの構造化設計","S2：GASで作る小さな自動化","S3：AIと人のバトン設計","S4：A/Bテストでテンプレ改善","S5：KPI可視化と成果報告設計","S6：成果発表＆次の業務改善の種探し"]
      },
      practical: {
        badge: "実践〜先進向け",
        title: "PRACTICAL｜疑似案件で本格運用へ（6–8週間）",
        goal:  "評価・検証〜運用設計まで含め、再現性ある“仕組み化”に踏み込みます。",
        learnLeft: ["要件定義と設計","運用SLA/権限/失敗時設計","実装と検証","RAGミニPoC"],
        modules: ["要件定義ロールプレイ","設計書（データ流・権限・失敗時）","実装＋動作検証（GAS）","RAGミニPoC（FAQ50件）"],
        flow: ["S1：要件定義ロールプレイ","S2：設計フェーズ","S3：構築と動作検証","S4：納品物一式の整備","S5：RAGミニPoC実装","S6：成果発表＆ふりかえり"]
      }
    };

    function qs(name){
      const u = new URL(location.href);
      return u.searchParams.get(name);
    }

    // ------- 初期化 -------
    (function init(){
      const plan = (qs('plan') || '').toLowerCase();
      const score = qs('score') || '—';
      const level = qs('level') || '—';

      // planが不正なら practical/ middle / entry の順で推奨を選ぶ（スコアがあれば簡易推定）
      let planKey = (plan in COURSES) ? plan : null;
      if(!planKey){
        const n = Number(score);
        planKey = Number.isFinite(n)
          ? (n>=70 ? 'practical' : n>=40 ? 'middle' : 'entry')
          : 'entry';
      }
      const data = COURSES[planKey];

      // バッジ/タイトル
      document.getElementById('badges').innerHTML =
        `<span class="badge">${data.badge}</span>` +
        (level && level!=='—' ? `<span class="badge">レベル：${level}</span>` : '');
      document.getElementById('title').textContent = data.title;
      document.getElementById('meta').textContent = `診断スコア：${score} ／ レベル：${level || '—'}`;

      // 本文
      document.getElementById('goalBody').textContent = data.goal;
      document.getElementById('learnLeft').innerHTML = data.learnLeft.map(li=>`<li>${li}</li>`).join('');
      document.getElementById('modules').innerHTML  = data.modules.map(li=>`<li>${li}</li>`).join('');
      document.getElementById('flow').innerHTML     = data.flow.map(li=>`<li>${li}</li>`).join('');

      // 申込みリンク（Stripe）
      const apply = document.getElementById('applyBtn');
      const url = STRIPE[planKey] || '#';
      apply.href = url;
      apply.textContent = "この内容で申し込む";
      if(url==='#'){ apply.title = "Stripeリンク未設定（管理者向け）"; }

    })();
  </script>
</body>
</html>
