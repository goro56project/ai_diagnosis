<script>
/* ===== 学習の流れ → 各コース詳細へ “確実に” 遷移させる ===== */
(function () {
  // 現在のクエリから引き継ぐキー
  const carryKeys = ['score', 'level', 'lv'];
  const inQs = new URLSearchParams(location.search);

  // 詳細ページURLを安全に作る（どのページ階層でも壊れない）
  function buildDetailURL(course) {
    // 現在パスのディレクトリを基準に exo_course_detail.html を解決
    const dir = location.href.replace(/[^/]*$/, ''); // 末尾ファイル名を落とす
    const u = new URL('exo_course_detail.html', dir);
    u.searchParams.set('course', String(course || 'entry').toLowerCase());
    carryKeys.forEach(k => { const v = inQs.get(k); if (v) u.searchParams.set(k, v); });
    u.hash = 'flow';
    return u.toString();
  }

  // 実遷移（他スクリプトの妨害を回避）
  function hardNavigate(href) {
    try {
      window.onbeforeunload = null;
      document.activeElement && document.activeElement.blur();
    } catch(_) {}
    // もっとも強い遷移（assignでもOKだが、href代入が最短）
    window.location.href = href;
  }

  function wire(el) {
    const course = el.getAttribute('data-course');
    if (!course) return; // data-courseが無いと何もしない
    const url = buildDetailURL(course);

    // <a>ならhrefもセット（通常クリックで動く）
    if (el.tagName === 'A') el.setAttribute('href', url);

    // 何かに阻害されても遷移させる（captureで先取り）
    const handler = (e) => { e.preventDefault(); e.stopImmediatePropagation?.(); hardNavigate(url); };
    el.addEventListener('click',   handler, true);
    el.addEventListener('mousedown', handler, true);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') handler(e);
    }, true);
    el.setAttribute('aria-label', '学習の流れ（詳細ページへ移動）');
  }

  // .flow-link と .flow-btn の両方をサポート
  document.querySelectorAll('.flow-link, .flow-btn').forEach(wire);
})();
</script>
