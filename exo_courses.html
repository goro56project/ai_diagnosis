<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>診断結果の詳細｜AI偏差値診断</title>
  <style>
    :root{--brand:#7356b6;--ink:#222;--muted:#666;--card:#fff;--bg:#f5f3ff;}
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;margin:0;color:var(--ink);background:var(--bg)}
    header{background:#fff;border-bottom:1px solid #eee;padding:18px;text-align:center}
    main{max-width:980px;margin:24px auto;padding:0 16px 60px}
    .card{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.06);padding:22px;margin:16px 0}
    .score{font-size:96px;font-weight:800;color:#4b53d7;line-height:1}
    .badge{display:inline-block;background:#eef;padding:.35em .8em;border-radius:999px;margin-left:8px}
    h1{font-size:22px;margin:0 0 8px}
    h2{font-size:18px;margin:18px 0 10px}
    .muted{color:var(--muted)}
    a.btn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;border-radius:10px;padding:12px 16px}
  </style>
</head>
<body>
  <header>
    <h1>診断結果の詳細</h1>
    <div class="muted">AI偏差値診断</div>
  </header>

  <main>
    <section class="card">
      <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
        <div class="score" id="score">--</div>
        <div>
          <div>AI偏差値 <span class="badge" id="level">--</span></div>
          <p id="lead" class="muted" style="margin-top:8px"></p>
        </div>
      </div>

      <h2>おすすめアクション</h2>
      <ul id="bullets" style="margin-left:18px"></ul>

      <div style="margin-top:18px">
        <a class="btn" href="./index.html">診断ページに戻る</a>
      </div>
    </section>
  </main>

  <script>
    // URLパラメータからスコア取得
    const params = new URLSearchParams(location.search);
    const score = Math.max(0, Math.min(100, Number(params.get('score') || 0)));

    // レベル判定
    function levelFrom(s){
      if (s>=70) return {label:"先進層", key:"practical"};
      if (s>=55) return {label:"実践層", key:"practical"};
      if (s>=40) return {label:"初級〜中級", key:"middle"};
      return {label:"入門層", key:"entry"};
    }

    const LEADS = {
      entry:"まずは安全な使い方と型を整えて、短期で成果を出す土台を作ります。",
      middle:"品質と効率を同時に上げる短期集中プランをおすすめします。",
      practical:"評価・検証〜運用設計までを含め、再現性のある仕組み化へ踏み込みましょう。"
    };
    const BULLETS = {
      entry:["基本リテラシーと安全ルールを整備","業務テンプレ/良いプロンプトの型を準備","小さく試して成功体験を蓄積"],
      middle:["業務テンプレの整備と自動化の入口","評価・検証フレームとA/B運用","短期集中プラン（成果レビュー）"],
      practical:["要件整理・導入ロードマップの設計","運用SLA設計とガバナンス","RAG/エージェントの社内展開"]
    };

    // 反映
    const lv = levelFrom(score);
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = lv.label;
    document.getElementById('lead').textContent = LEADS[lv.key] || "";
    document.getElementById('bullets').innerHTML =
      (BULLETS[lv.key]||[]).map(t=>`<li>${t}</li>`).join("");
  </script>
</body>
</html>
