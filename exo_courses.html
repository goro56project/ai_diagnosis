<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>おすすめコース | MYGPT School</title>
<style>
  body{margin:0;background:#f8fafc;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  .wrap{max-width:960px;margin:24px auto;padding:0 16px}
  h1{margin:0 0 12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px}
  .card h2{margin:4px 0 6px;font-size:18px}
  .muted{color:#475569;font-size:14px;margin:0 0 10px}
  .btn{display:inline-block;background:#111827;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px}
</style>
</head>
<body>
  <div class="wrap">
    <h1>おすすめコース</h1>
    <p class="muted">各コースの詳細ページからお申し込み（Stripe決済）に進めます。</p>
    <div class="grid">
      <div class="card">
        <h2>ENTRY（入門）</h2>
        <p class="muted">非エンジニアの最短スターター。</p>
        <a class="btn" href="./entry_course_detail.html">ENTRYの詳細を見る</a>
      </div>
      <div class="card">
        <h2>MIDDLE（中級）</h2>
        <p class="muted">実務で回るテンプレと自動化の土台。</p>
        <a class="btn" href="./middle_course_detail.html">MIDDLEの詳細を見る</a>
      </div>
      <div class="card">
        <h2>PRACTICAL（実践）</h2>
        <p class="muted">現場導入・成果コミット型。</p>
        <a class="btn" href="./practical_course_detail.html">PRACTICALの詳細を見る</a>
      </div>
    </div>
  </div>
</body>
</html>
