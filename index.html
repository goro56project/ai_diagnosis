<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>AI偏差値診断｜メール登録→診断→結果メール</title>

  <!-- ★ここを最新 exec に必ず差し替え -->
  <script>
    window.GAS_URL = "https://script.google.com/macros/s/AKfycbxsiEM9lpzmavJUejb3jt2PuQkluzerEj20_KC29bXf1K9TcCyIIxo1aIGgUgYjGto5/exec";
    window.RESULT_KEY = "RG8rK7vQ3bX1pY2z";
  </script>

  <style>
    :root { --brand:#635bff; --ink:#111827; --card:#fff; --bg:#f8fafc; --muted:#6b7280; --line:#e5e7eb; }
    *{ box-sizing:border-box } body{ margin:0; color:var(--ink); background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Hiragino Kaku Gothic ProN,Meiryo,sans-serif; line-height:1.7; }
    main{ max-width:980px; margin:0 auto; padding:20px 16px }
    h1{ font-size:clamp(26px,3.5vw,32px); margin:10px 0 8px; text-align:center }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:16px 0 }
    .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap }
    input[type="email"]{ flex:1 1 280px; min-width:240px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font:inherit }
    .btn{ padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit }
    .btn.primary{ background:var(--brand); color:#fff; border-color:var(--brand) }
    .btn[disabled]{ opacity:.6; pointer-events:none }
    fieldset{ border:1px solid var(--line); border-radius:10px; padding:10px; margin:10px 0 }
    .muted{ color:var(--muted) }
  </style>
</head>
<body>
  <main>
    <h1>AI偏差値診断</h1>

    <!-- STEP1: メール登録 -->
    <section class="card">
      <h2>STEP1｜診断結果をメールで受け取る</h2>
      <div class="row">
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="メールアドレスを入力" />
        <button id="btn-register" class="btn primary" type="button">登録する</button>
      </div>
      <p id="toast" class="muted" style="margin-top:6px"></p>
    </section>

    <!-- STEP2: 10問（省略可・ダミー値は3に） -->
    <section class="card" id="sec-questions">
      <h2>STEP2｜10問に回答</h2>
      <div id="qs"></div>
      <div style="text-align:right;margin-top:10px">
        <button id="btn-diagnose" class="btn primary" type="button">診断する</button>
      </div>
    </section>

    <!-- STEP3: 結果 -->
    <section class="card">
      <h2>STEP3｜診断結果</h2>
      <p>AI偏差値：<strong id="score-out">--</strong> ／ <span id="lv-label">--</span></p>
      <p id="advice" class="muted"></p>
    </section>
  </main>

  <!-- CORS回避：隠しiframe＋フォーム -->
  <iframe name="gs_ghost" style="display:none;width:0;height:0;border:0"></iframe>
  <form id="ghostForm" target="gs_ghost" method="POST" action="" style="display:none">
    <input type="hidden" name="type"  value="">
    <input type="hidden" name="email" value="">
    <input type="hidden" name="score" value="">
    <input type="hidden" name="q1" value=""><input type="hidden" name="q2" value="">
    <input type="hidden" name="q3" value=""><input type="hidden" name="q4" value="">
    <input type="hidden" name="q5" value=""><input type="hidden" name="q6" value="">
    <input type="hidden" name="q7" value=""><input type="hidden" name="q8" value="">
    <input type="hidden" name="q9" value=""><input type="hidden" name="q10" value="">
    <input type="hidden" name="key" value=""><input type="hidden" name="t" value="">
    <input type="hidden" name="source" value="ai_diagnosis_top_v1_1">
  </form>

  <script>
  (function(){
    const $ = s => document.querySelector(s);
    const emailEl = $('#email'), toastEl = $('#toast'), ghostForm = $('#ghostForm');
    const scoreOut = $('#score-out'), lvLabel = $('#lv-label'), adviceEl = $('#advice');

    // 質問UI（1〜5ラジオ）
    const qs = $('#qs');
    for(let i=1;i<=10;i++){
      const fs = document.createElement('fieldset');
      fs.innerHTML = `<legend>Q${i}</legend>` + Array.from({length:5},(_,k)=>k+1)
        .map(v=>`<label style="margin-right:8px"><input type="radio" name="q${i}" value="${v}" ${v===3?'checked':''}>${v}</label>`).join('');
      qs.appendChild(fs);
    }

    function getVal(name){ const el=document.querySelector(\`input[name="\${name}"]:checked\`); return el?Number(el.value):3; }
    function collect(){ return Array.from({length:10},(_,i)=>getVal('q'+(i+1))); }
    function calcScore(vals){ const avg=vals.reduce((a,b)=>a+b,0)/vals.length; return Math.min(100,Math.max(20,Math.round(avg*20))); }
    function levelLabel(s){ if(s>=85)return'Lv5：高度運用'; if(s>=70)return'Lv4：継続運用'; if(s>=55)return'Lv3：部分運用'; if(s>=40)return'Lv2：試行段階'; return'Lv1：未着手'; }
    function nowTs(){ return new Date().toISOString(); }

    function postToGAS(payload){
      ghostForm.action = window.GAS_URL;
      ghostForm.reset();
      for(const [k,v] of Object.entries(payload)){
        const input = ghostForm.querySelector(\`input[name="\${k}"]\`);
        if(input) input.value = String(v);
      }
      ghostForm.submit(); // ← これで確実に送信
    }

    $('#btn-register').addEventListener('click', ()=>{
      const email = (emailEl.value||'').trim();
      if(!email){ toastEl.textContent = 'メールアドレスを入力してください。'; return; }
      toastEl.textContent = '送信中…';
      postToGAS({ type:'register', email, key:window.RESULT_KEY, t:nowTs(), source:'ai_diagnosis_top_v1_1' });
      setTimeout(()=>{ toastEl.textContent = '登録しました。メールをご確認ください。'; }, 800);
    });

    $('#btn-diagnose').addEventListener('click', ()=>{
      const vals = collect();
      const score = calcScore(vals);
      scoreOut.textContent = String(score);
      lvLabel.textContent = levelLabel(score);
      adviceEl.textContent = '改善ポイントをメールでもご案内します。';

      const email = (emailEl.value||'').trim();
      if(email){
        postToGAS({
          type:'diagnosis', email, score,
          q1:vals[0],q2:vals[1],q3:vals[2],q4:vals[3],q5:vals[4],
          q6:vals[5],q7:vals[6],q8:vals[7],q9:vals[8],q10:vals[9],
          key:window.RESULT_KEY, t:nowTs(), source:'ai_diagnosis_top_v1_1'
        });
      }
    });
  })();
  </script>
</body>
</html>
