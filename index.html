<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>AI偏差値診断｜メール登録→診断→結果メール</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFQZF4F1QW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-QFQZF4F1QW', { send_page_view: true, transport_type:'beacon', debug_mode: true });
  </script>

  <!-- ★GAS WebアプリURL（exec） -->
  <script>
    window.GAS_URL = "https://script.google.com/macros/s/AKfycbzLvAEpvLfVGN3V2f9i8ykXC_AqANomEHKQ5jnhP04FUa7oui5nYk6BGSEzsHNJHbvq/exec";
  </script>

  <style>
    /* （CSSはそのまま、変更なし） */
    :root { --brand:#635bff; --ink:#111827; --card:#fff; --bg:#f8fafc; --muted:#6b7280; --line:#e5e7eb; }
    *{ box-sizing:border-box }
    body{ margin:0; color:var(--ink); background:var(--bg); font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif }
    header{ background:#fff; border-bottom:1px solid var(--line) }
    .wrap{ max-width:1000px; margin:0 auto; padding:20px 16px }
    h1{ font-size:clamp(26px,3.5vw,32px); margin:6px 0 8px }
    p.lead{ color:var(--muted); margin:0 0 12px }
    main{ max-width:1000px; margin:0 auto; padding:20px 16px 60px }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:16px 0 }
    .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap }
    input[type="email"]{ flex:1 1 260px; min-width:240px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font:inherit }
    .btn{ padding:12px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; cursor:pointer; font:inherit }
    .btn.primary{ background:var(--brand); color:#fff; border-color:var(--brand) }
    .btn[disabled]{ opacity:.6; pointer-events:none }
    .muted{ color:var(--muted) }
    .hint{ font-size:12px; color:var(--muted) }
    .warn{ font-size:13px; color:#92400e; background:#fffbeb; border:1px solid #fde68a; padding:8px 10px; border-radius:10px; margin-top:10px }
    .pill{ display:inline-block; padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:#fff }
    .result{ display:flex; gap:12px; align-items:center; flex-wrap:wrap }
    .score{ font-size:28px; font-weight:800; color:#111827 }
    ul.bullets{ margin:8px 0 0 20px }
    footer{ text-align:center; font-size:14px; border-top:1px solid var(--line); background:#fff; padding:20px; margin-top:40px }
    footer a{ color:var(--ink); text-decoration:none }
    footer a + a{ margin-left:12px }
    .qgrid{ display:grid; grid-template-columns:minmax(140px,1fr) repeat(5,minmax(48px,70px)); gap:8px 10px; align-items:center }
    .qgrid .choice{ display:flex; justify-content:center; align-items:center; height:40px }
    .qgrid .choice input{ width:18px; height:18px }
    .qgrid-head>div:first-child{ visibility:hidden }
    @media (max-width:760px){ .qgrid{ grid-template-columns:repeat(5,1fr) } .qgrid>div:first-child{ display:none } }
  </style>
</head>
<body>
  <!-- （HTML本体はそのまま省略：質問や結果表示UIは変えない） -->

  <!-- 隠しiframe＋フォーム -->
  <iframe name="gs_ghost" style="display:none;width:0;height:0;border:0"></iframe>
  <form id="ghostForm" target="gs_ghost" method="POST" action="" style="display:none">
    <input type="hidden" name="type"   value="">
    <input type="hidden" name="email"  value="">
    <input type="hidden" name="score"  value="">
    <input type="hidden" name="t"      value="">
  </form>

  <script>
  (function(){
    const $email   = document.getElementById('email');
    const $btnReg  = document.getElementById('btn-register');
    const $btnSkip = document.getElementById('btn-skip');
    const $btnDiag = document.getElementById('btn-diagnose');
    const $toast   = document.getElementById('toast');

    const $scoreOut= document.getElementById('score-out');
    const $lvLabel = document.getElementById('lv-label');
    const $heading = document.getElementById('cta-heading');
    const $lead    = document.getElementById('result-lead');
    const $bullets = document.getElementById('result-bullets');
    const $detailLock = document.getElementById('detail-lock');
    const $lp = document.getElementById('lp-link');
    const $apply = document.getElementById('apply-link');

    const state = { email:"", score: null, levelKey:"entry" };
    const isEmail = v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);

    function postToGAS(fields){
      const f = document.getElementById('ghostForm');
      f.action = window.GAS_URL;
      f.elements.type.value  = fields.type || '';
      f.elements.email.value = fields.email || '';
      f.elements.score.value = String(fields.score ?? '');
      f.elements.t.value     = String(Date.now());
      f.submit();
    }

    function gatherAnswers(){
      let sum = 0;
      for(let i=1;i<=10;i++){
        const r = document.querySelector(`input[name="q${i}"]:checked`);
        sum += r ? Number(r.value) : 3;
      }
      return sum;
    }
    function calcScore(){ return Math.max(0, Math.min(100, Math.round(gatherAnswers()*2))); }

    function levelFrom(score){
      if(score >= 81) return {key:'practical', label:'先進層'};
      if(score >= 61) return {key:'practical', label:'上級層'};
      if(score >= 41) return {key:'middle',    label:'中級層（41–60）'};
      if(score >= 21) return {key:'entry',     label:'入門層（21–40）'};
      return {key:'entry', label:'初心者層（0–20）'};
    }

    const COPY = {
      entry:{ heading:'まずは安全に毎日AIに触れる習慣化から。',
              lead:'資料・メール・要約をAIで型化。成功プロンプトをテンプレ化して再利用を進めます。',
              bullets:['基本リテラシー整備','テンプレ導入','日次実践→改善'] },
      middle:{ heading:'売上直結の活用へ。テンプレ×自動化で仕組み化。',
               lead:'商談フォローやコピー作成など、定型業務をAIテンプレに落とし込みKPIで改善。',
               bullets:['商談後フォロー自動化','コピーABテスト','テンプレ共有'] },
      practical:{ heading:'戦略にAIを統合し、半自動で回る収益化へ。',
                  lead:'KPI設計→自動化→PoC検証まで網羅。RAG/エージェントも視野に。',
                  bullets:['KPIとダッシュボード','GAS/連携の実装','PoC→スケール判断'] }
    };

    function render(){
      $scoreOut.textContent = state.score ?? '--';
      const lv = levelFrom(state.score || 0);
      state.levelKey = lv.key;
      $lvLabel.textContent = lv.label;

      const c = COPY[lv.key];
      $heading.textContent = c.heading;
      $lead.textContent = c.lead;
      $bullets.innerHTML = c.bullets.map(x=>`<li>${x}</li>`).join('');

      const qs = `score=${encodeURIComponent(state.score||0)}`;
      $lp.href    = `./exo_courses.html?${qs}`;
      $apply.href = `./exo_course_detail.html?plan=${lv.key}&${qs}`;

      $detailLock.style.display = state.email ? 'none' : 'block';
    }

    $lp.addEventListener('click', (e)=>{ if(!state.email){ e.preventDefault(); alert('詳細を見るにはメール登録が必要です。'); }});

    // ✅ 修正ポイント：登録時は保存だけ（メール送らない）
    $btnReg.addEventListener('click', ()=>{
      const v = ($email.value||'').trim();
      if(!isEmail(v)){ alert('メールアドレスを正しく入力してください。'); $email.focus(); return; }
      state.email = v;
      $toast.textContent = 'メールを登録しました。診断後に詳細レポートが届きます。';
    });

    $btnSkip.addEventListener('click', ()=>{
      document.getElementById('sec-questions').scrollIntoView({behavior:'smooth'});
    });

    // ✅ 修正ポイント：診断時にだけ GAS へ送信
    $btnDiag.addEventListener('click', ()=>{
      state.score = calcScore();
      render();
      if(state.email){
        postToGAS({ type:'result', email:state.email, score:state.score });
      }
      document.getElementById('result-card').scrollIntoView({behavior:'smooth'});
    });

    render();
  })();
  </script>
</body>
</html>
