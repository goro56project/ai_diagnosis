<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI偏差値診断｜詳細レポート</title>

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFQZF4F1QW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QFQZF4F1QW', { send_page_view: true, transport_type:'beacon' });
  </script>

  <style>
    :root{
      --ink:#0f172a; --muted:#475569; --bg:#f8fafc; --card:#fff; --line:#e5e7eb;
      --brand:#111827; --pill:#111827;
    }
    *{ box-sizing:border-box }
    body{
      margin:0; color:var(--ink); background:var(--bg);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    }
    header{ background:#fff; border-bottom:1px solid var(--line) }
    .wrap{ max-width:1000px; margin:0 auto; padding:22px 16px }
    h1{ font-size:clamp(22px,3.5vw,28px); margin:8px 0 0 }
    .lead{ color:var(--muted); margin:10px 0 0 }
    main{ max-width:1000px; margin:0 auto; padding:22px 16px 60px }
    .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
    .grid{ display:grid; gap:16px }
    .badge{
      display:inline-block; font-size:12px; padding:4px 10px; border:1px solid var(--line);
      border-radius:999px; color:#111827; background:#fff;
    }
    .scorebox{ display:flex; gap:18px; align-items:center; flex-wrap:wrap }
    .score{
      font-size:44px; font-weight:800; line-height:1; color:#111827;
    }
    .kv{ display:grid; grid-auto-flow:column; gap:16px; align-items:start }
    .kv > div{ min-width:180px }
    .btn{
      display:inline-block; padding:12px 16px; border-radius:12px; text-decoration:none;
      background:#111827; color:#fff; font-weight:700; border:1px solid #111827;
    }
    .btn.light{ background:#fff; color:#111827; border:1px solid var(--line) }
    h2{ font-size:18px; margin:12px 0 10px }
    h3{ font-size:16px; margin:14px 0 8px }
    ul{ padding-left:20px; margin:8px 0 }
    .muted{ color:var(--muted) }
    .pill{
      display:inline-block; padding:6px 12px; border-radius:999px; background:#eef2ff; color:#3730a3;
      border:1px solid #c7d2fe; font-weight:700;
    }
    footer{ text-align:center; font-size:14px; border-top:1px solid var(--line); background:#fff; padding:20px; margin-top:40px }
    footer a{ color:var(--ink); text-decoration:none }
    footer a + a{ margin-left:12px }
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <span class="badge">AI偏差値診断｜詳細レポート</span>
      <h1 id="resultTitle">あなたの結果</h1>
      <p class="lead">メールの要約版よりも詳しい解説と、90日ロードマップ、コース案内、特典をご案内します。</p>
    </div>
  </header>

  <main class="wrap grid" style="gap:20px">

    <!-- スコアとおすすめ -->
    <section class="card">
      <div class="kv">
        <div>
          <div class="muted">スコア</div>
          <div class="score" id="scoreOut">--</div>
        </div>

        <div>
          <div class="muted">レベル</div>
          <div class="pill" id="levelLabel">--</div>
        </div>

        <div>
          <div class="muted">おすすめ</div>
          <div id="recommendText" class="pill">--</div>
        </div>
      </div>

      <div style="margin-top:14px; display:flex; gap:12px; flex-wrap:wrap">
        <a class="btn" id="applyBtn" href="#" rel="noopener">申し込む</a>
        <a class="btn light" id="coursesBtn" href="#" rel="noopener">おすすめコースを見る</a>
      </div>
    </section>

    <!-- 解説 -->
    <section class="card">
      <h2>🧠 診断結果の解説</h2>
      <p id="explain" class="muted" style="margin-top:0"></p>

      <h3>🔧 今日からの3ステップ</h3>
      <ul id="steps"></ul>
    </section>

    <!-- 特典 -->
    <section class="card">
      <h2>🎁 特典</h2>
      <ul style="margin-top:6px">
        <li><a id="bonusPdf" href="#" target="_blank" rel="noopener">AI業務改善50選（PDF）</a></li>
      </ul>
      <p class="muted" style="margin-top:8px">※PDFの場所は必要に応じて差し替えてください。</p>
    </section>

  </main>

  <footer>
    <p>
      <a href="./terms.html" target="_blank" rel="noopener">利用規約</a>
      <a href="./privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>
      <a href="./law.html" target="_blank" rel="noopener">特定商取引法に基づく表記</a>
    </p>
  </footer>

  <script>
  (function(){
    // --- 入力（URLパラメータ）
    const params = new URLSearchParams(location.search);
    const rawId  = (params.get('id') || '').trim();
    const score  = clamp(Number(params.get('score') || 0));

    // --- 見出しの「◯◯さんの結果」
    const cleanName = rawId.replace(/(さん|さま|様)$/i, '');
    const displayName = cleanName ? `${cleanName}さん` : 'あなた';
    const h1 = document.querySelector('#resultTitle') || document.querySelector('h1');
    if (h1) h1.textContent = `${displayName}の結果`;

    // --- スコア表示
    document.getElementById('scoreOut').textContent = String(score);

    // --- レベル／おすすめ／文面
    const lv = levelFrom(score);                    // { key, label, recommendLabel }
    document.getElementById('levelLabel').textContent = lv.label;
    document.getElementById('recommendText').textContent = lv.recommendLabel;

    // --- 解説と3ステップ（プランごとにコピー）
    const COPY = {
      entry: {
        explain: 'AIはこれから。まずは「毎日触る」習慣づくりと安全な使い方の整備から。資料・メール・要約など、勝ちやすい領域をテンプレ化していきましょう。',
        steps: [
          '議事録／要約／メールの一次稿をAIで作る習慣化',
          '成功したプロンプトをテンプレ化し、チームで共有',
          '安全ルール（情報の扱い・レビュー体制）を明文化'
        ],
        cta: { planText:'ENTRY', planKey:'entry' }
      },
      middle: {
        explain: '基礎はOK。次は「売上直結」への転換。集客〜商談〜成約の各所にAIテンプレと小さな自動化を組み込み、KPIで改善サイクルを回しましょう。',
        steps: [
          'LP/SNSコピーの一次稿をAI→人が仕上げる運用',
          '商談フォロー（議事録→要点抽出→お礼メール）を半自動化',
          'テンプレの成果をKPIで可視化し、A/Bで改善'
        ],
        cta: { planText:'MIDDLE', planKey:'middle' }
      },
      practical: {
        explain: '高度な活用段階。自動化・RAG・エージェント等を、要件定義→実装→運用ルールまで設計し、仕組みとして定着させていきます。',
        steps: [
          '優先業務の要件定義とデータ設計を行う',
          'RAG/自動化のPoCを作り、失敗時ハンドリングも設計',
          'SOPとダッシュボードで運用を組織に定着'
        ],
        cta: { planText:'PRACTICAL', planKey:'practical' }
      }
    };

    const copy = COPY[lv.key] || COPY.entry;
    document.getElementById('explain').textContent = copy.explain;
    document.getElementById('steps').innerHTML = copy.steps.map(s=>`<li>${s}</li>`).join('');

    // --- ボタンリンク（コース一覧／申込詳細）
    const scoreQS = encodeURIComponent(score);
    document.getElementById('coursesBtn').href = `./exo_courses.html?score=${scoreQS}`;
    document.getElementById('applyBtn').textContent = `${copy.cta.planText}に申し込む`;
    document.getElementById('applyBtn').href = `./exo_course_detail.html?plan=${copy.cta.planKey}&score=${scoreQS}`;

    // --- 特典PDF（必要に応じて差し替え）
    document.getElementById('bonusPdf').href = './assets/ai_ops50.pdf';

    // === helpers ===
    function clamp(n){ n = Number(n)||0; return Math.max(0, Math.min(100, Math.round(n))); }

    function levelFrom(s){
      if (s >= 81) return { key:'practical', label:'先進層（81–100）', recommendLabel:'PRACTICAL（自動化）' };
      if (s >= 61) return { key:'practical', label:'上級層（61–80）',   recommendLabel:'PRACTICAL（自動化）' };
      if (s >= 41) return { key:'middle',    label:'中級層（41–60）',   recommendLabel:'MIDDLE（売上直結）' };
      if (s >= 21) return { key:'entry',     label:'初級層（21–40）',   recommendLabel:'ENTRY（習慣化）' };
      return            { key:'entry',     label:'初心者層（0–20）',    recommendLabel:'ENTRY（習慣化）' };
    }
  })();
  </script>
</body>
</html>
